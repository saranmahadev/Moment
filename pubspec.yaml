name: moment
description: A completely local life journal. Text, emoji, photo, video, audio and location logs. No cloud, no account.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.32.0
  sqlite3: ^3.8.0
  path: ^1.9.0
  path_provider: ^2.1.0
  uuid: ^4.5.0
  flutter_secure_storage: ^9.2.0
  crypto: ^3.0.6
  local_auth: ^2.3.0
  intl: ^0.20.0
  image: ^4.3.0
  image_picker: ^1.1.0
  record: ^6.0.0
  just_audio: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.32.0
  build_runner: ^2.4.0

# Encrypted database: use the SQLite3MultipleCiphers build of sqlite3.
# Do not add sqlcipher_flutter_libs or sqlite3_flutter_libs next to this.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/Inter-SemiBold.ttf
          weight: 600
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader/Newsreader-Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader/Newsreader-Italic.ttf
          weight: 400
          style: italic
