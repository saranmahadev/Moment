name: Site

# Publishes site/ to GitHub Pages. The site is plain files (no build step):
# the page, the app's fonts, screenshots, icons and the film.
#
# One-time setup by the repository owner: Settings → Pages → Build and
# deployment → Source: "GitHub Actions". Until that is set, the deploy
# step fails and nothing is published.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
