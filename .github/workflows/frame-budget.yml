name: Frame budget

# Scrolls the real shell with 20,000 logs on an Android emulator, in
# profile mode, and fails if frame build times go past
# test_driver/frame_budget.json. An emulator on a CI machine is not a
# phone: this catches regressions; how it feels is checked on a device.
#
# Slow (an emulator boots for several minutes), so it does not run on every
# push: when the check itself or the dependencies change, weekly on main,
# and by hand (Actions -> Frame budget -> Run workflow) before a release.
on:
  push:
    paths:
      - integration_test/**
      - test_driver/**
      - pubspec.lock
      - .github/workflows/frame-budget.yml
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  frame-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Scroll on an emulator and check the frame budget
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          # The default 2 GB is too little for 20,000 logs in memory plus
          # the test machinery; the emulator was killed mid-run.
          ram-size: 4096M
          heap-size: 512M
          cores: 4
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: flutter drive --profile --no-dds --driver=test_driver/frame_budget_driver.dart --target=integration_test/frame_budget_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frame-budget-timelines
          path: build/frame_budget/
          retention-days: 14
