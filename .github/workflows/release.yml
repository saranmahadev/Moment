name: Release

# Tags a release and publishes its APKs (one per CPU type, plus a common
# one) as a GitHub Release, in one run.
#
# Run it by hand (Actions → Release → Run workflow) once CI is green on the
# release commit and the phase exit gate in docs/ROADMAP.md is met. It
# refuses to run if the version does not match pubspec.yaml, if the version
# is already released, or if CHANGELOG.md has no entry for it; then it
# analyses, tests, builds and checks the release manifest before anything
# is tagged. See docs/WORKFLOW.md, "Releases".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, as in pubspec.yaml (for example 1.0.0, or 1.0.0-rc.1 for a release candidate)"
        required: true
        type: string
      commit:
        description: "Commit to release (empty: the head of the chosen branch)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0
      - name: Check the version, the changelog and that the tag is free
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::'$VERSION' is not a version like 1.0.0 or 1.0.0-rc.1"; exit 1
          fi
          declared=$(sed -n 's/^version: *\([0-9a-z.-]*\).*/\1/p' pubspec.yaml)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::pubspec.yaml at this commit is $declared, not $VERSION"; exit 1
          fi
          # A tag that already exists is fine if it is this very commit and
          # has no release yet: the run then only builds and publishes.
          # (That is how a tag pushed by hand gets its release and APK.)
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git rev-parse "$TAG^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$TAG already exists and points at another commit"; exit 1
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "::error::$TAG is already released"; exit 1
            fi
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
          fi
          awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no entry for $VERSION"; exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # The same pin as ci.yml and release-check.yml.
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - name: Build the common APK and one APK per CPU type
        run: |
          flutter build apk --release
          mkdir -p "$RUNNER_TEMP/built"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/built/universal.apk"
          flutter build apk --release --split-per-abi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "$RUNNER_TEMP/built/$abi.apk"
          done
          ls -l "$RUNNER_TEMP/built"
      - name: Check the permissions of the release manifest
        run: dart run tool/check_manifest.dart build/app/intermediates/merged_manifests/release
      - name: Sign with the release key, if one is configured
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # moment-<version>.apk is the common one (every CPU type, large);
          # moment-<version>-<cpu>.apk is one CPU type (small).
          names=("moment-$VERSION.apk:universal" \
                 "moment-$VERSION-arm64-v8a.apk:arm64-v8a" \
                 "moment-$VERSION-armeabi-v7a.apk:armeabi-v7a" \
                 "moment-$VERSION-x86_64.apk:x86_64")
          if [ -n "$KEYSTORE_BASE64" ]; then
            keystore="$RUNNER_TEMP/release.jks"
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            for pair in "${names[@]}"; do
              out="${pair%%:*}"; built="$RUNNER_TEMP/built/${pair##*:}.apk"
              "$build_tools/apksigner" sign \
                --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
                --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
                --out "$out" "$built"
              "$build_tools/apksigner" verify "$out"
            done
            rm -f "$keystore"
            echo "note=Signed with the Moment release key: it installs over earlier releases signed with the same key." >> "$GITHUB_OUTPUT"
          else
            for pair in "${names[@]}"; do
              cp "$RUNNER_TEMP/built/${pair##*:}.apk" "${pair%%:*}"
            done
            echo "::warning::No release key configured (see docs/WORKFLOW.md): these APKs are signed with a throwaway debug key."
            echo "note=Signed with a throwaway debug key, because no release key is configured yet. It will not install over another release: back up in the app, uninstall, install this one, then restore." >> "$GITHUB_OUTPUT"
          fi
          echo "apks=moment-$VERSION-arm64-v8a.apk moment-$VERSION-armeabi-v7a.apk moment-$VERSION-x86_64.apk moment-$VERSION.apk" >> "$GITHUB_OUTPUT"
      - name: Release check (permissions, backup rules, cipher, signing, version, sizes)
        run: |
          export APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          manifest=$(find build/app/intermediates/merged_manifests/release -name AndroidManifest.xml | head -1)
          mkdir -p "$RUNNER_TEMP/checked" && cp moment-*.apk "$RUNNER_TEMP/checked/"
          dart run tool/release_check.dart --version "$VERSION" \
            --apks "$RUNNER_TEMP/checked" --manifest "$manifest"
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          APKS: ${{ steps.sign.outputs.apks }}
          SIGNING_NOTE: ${{ steps.sign.outputs.note }}
          TAG_EXISTS: ${{ steps.check.outputs.tag_exists }}
        run: |
          {
            echo
            echo "---"
            echo "**Android:** almost every phone made in the last several years wants \`moment-$VERSION-arm64-v8a.apk\` (about a third of the size). Older 32-bit phones want \`-armeabi-v7a\`, and x86 emulators \`-x86_64\`. If you are not sure, \`moment-$VERSION.apk\` works on all of them but is much larger. $SIGNING_NOTE"
            echo
            echo "SHA-256:"
            echo
            for apk in $APKS; do echo "- \`$apk\`: \`$(sha256sum "$apk" | cut -d' ' -f1)\`"; done
          } >> "$RUNNER_TEMP/notes.md"
          # The tag is created through the API (an annotated tag, then its
          # ref). GitHub refuses to let a workflow tag a commit whose
          # workflow files differ from main's, which only happens when
          # releasing an older commit: then the tag has to be pushed by
          # hand, and this workflow run again to publish it.
          if [ "$TAG_EXISTS" != "true" ]; then
            commit=$(git rev-parse HEAD)
            if ! tag_object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
                  -f tag="$TAG" -f message="Moment $VERSION" \
                  -f object="$commit" -f type=commit --jq .sha) ||
               ! gh api "repos/$GITHUB_REPOSITORY/git/refs" \
                  -f ref="refs/tags/$TAG" -f sha="$tag_object" --silent; then
              echo "::error::GitHub would not let this workflow tag $commit (its workflow files differ from main's). Push the tag yourself: git tag -a $TAG $commit -m \"Moment $VERSION\" && git push origin $TAG. Then run this workflow again: it will publish the release for the tag."
              exit 1
            fi
          fi
          # A release candidate (1.0.0-rc.1) is published as a pre-release.
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" $APKS --verify-tag "${prerelease[@]}" \
            --title "Moment $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
