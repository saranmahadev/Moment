name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create platform folders if they are not committed yet
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android,ios --project-name moment --org app.moment
          fi
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test --coverage

  no-internet-permission:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create platform folders if they are not committed yet
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android,ios --project-name moment --org app.moment
          fi
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --release
      - name: Fail if the release manifest asks for the internet
        run: dart run tool/check_manifest.dart build/app/intermediates/merged_manifests/release
      - uses: actions/upload-artifact@v4
        with:
          name: moment-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
